<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>AR Drawing</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#camera{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;background:#111}
#draw{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#ui{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:18px;background:rgba(20,20,20,.78);backdrop-filter:blur(12px);color:white;box-shadow:0 8px 30px #0005;z-index:5}
button{border:0;border-radius:12px;padding:10px 13px;background:#fff;color:#111;font-weight:700}
button.secondary{background:#333;color:#fff}
button.active{outline:3px solid #fff}
input[type=color]{width:42px;height:42px;border:0;padding:0;background:none;border-radius:50%;overflow:hidden}
input[type=range]{width:105px;accent-color:#fff}
#status{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:5;background:#0009;color:#fff;padding:8px 12px;border-radius:999px;font-size:13px;white-space:nowrap}
#hint{position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:4;color:#fff;background:#0007;padding:7px 11px;border-radius:10px;font-size:12px}
@media(max-width:600px){#ui{flex-wrap:wrap;justify-content:center}.wide{flex:1;min-width:120px}input[type=range]{width:90px}}
</style>
</head>
<body>
<video id="camera" autoplay playsinline muted></video>
<canvas id="draw"></canvas>
<div id="status">カメラを起動しています…</div>
<div id="hint">画面をなぞって描いてみよう</div>
<div id="ui">
  <button id="cameraBtn" class="wide">📷 カメラON</button>
  <input id="color" type="color" value="#ff3b30" title="色">
  <label>太さ <input id="size" type="range" min="1" max="40" value="6"></label>
  <label>透明度 <input id="opacity" type="range" min="10" max="100" value="90"></label>
  <button id="undo" class="secondary">↩</button>
  <button id="clear" class="secondary">消去</button>
  <button id="save">保存</button>
</div>

<script>
const video=document.getElementById('camera');
const canvas=document.getElementById('draw');
const ctx=canvas.getContext('2d');
const color=document.getElementById('color');
const size=document.getElementById('size');
const opacity=document.getElementById('opacity');
const status=document.getElementById('status');
let stream=null, drawing=false, last=null, history=[];

function resize(){
  const dpr=Math.min(devicePixelRatio||1,2);
  const w=innerWidth,h=innerHeight;
  const old=canvas.toDataURL();
  canvas.width=w*dpr; canvas.height=h*dpr;
  canvas.style.width=w+'px'; canvas.style.height=h+'px';
  ctx.setTransform(dpr,0,0,dpr,0,0);
  if(history.length) redraw();
}
addEventListener('resize',resize);
resize();

function pos(e){
  const r=canvas.getBoundingClientRect();
  return {x:e.clientX-r.left,y:e.clientY-r.top};
}
function snapshot(){ history.push(canvas.toDataURL('image/png')); if(history.length>20) history.shift(); }
function redraw(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  if(!history.length)return;
  const img=new Image();
  img.onload=()=>ctx.drawImage(img,0,0,innerWidth,innerHeight);
  img.src=history[history.length-1];
}
canvas.addEventListener('pointerdown',e=>{
  e.preventDefault(); snapshot(); drawing=true; last=pos(e); canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!drawing)return; e.preventDefault();
  const p=pos(e);
  ctx.globalAlpha=Number(opacity.value)/100;
  ctx.strokeStyle=color.value;
  ctx.lineWidth=Number(size.value);
  ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
  last=p;
});
canvas.addEventListener('pointerup',()=>{drawing=false;last=null});
canvas.addEventListener('pointercancel',()=>{drawing=false;last=null});

document.getElementById('clear').onclick=()=>{snapshot();ctx.clearRect(0,0,innerWidth,innerHeight)};
document.getElementById('undo').onclick=()=>{
  if(history.length<=1){ctx.clearRect(0,0,innerWidth,innerHeight);history=[];return}
  history.pop(); redraw();
};

async function startCamera(){
  try{
    if(stream) stream.getTracks().forEach(t=>t.stop());
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream;
    status.textContent='ARドローイング準備OK';
    document.getElementById('cameraBtn').textContent='📷 カメラOFF';
  }catch(err){
    status.textContent='カメラを使うにはHTTPSまたはlocalhostが必要です';
  }
}
document.getElementById('cameraBtn').onclick=()=>{
  if(stream){
    stream.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;
    status.textContent='カメラOFF';
    document.getElementById('cameraBtn').textContent='📷 カメラON';
  }else startCamera();
};

document.getElementById('save').onclick=()=>{
  const c=document.createElement('canvas');
  c.width=innerWidth*2;c.height=innerHeight*2;
  const x=c.getContext('2d');
  x.drawImage(video,0,0,c.width,c.height);
  x.globalAlpha=1;
  x.drawImage(canvas,0,0,c.width,c.height);
  const a=document.createElement('a');
  a.download='ar-drawing.png';a.href=c.toDataURL('image/png');a.click();
};
</script>
</body>
</html>
